name: Build Check

on:
  pull_request:
    branches:
      - main
      - fix-branch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - run: mkdir -p target

      - run: GOOS=linux GOARCH=${{ matrix.goarch }} go build -o target/agent main.go